services:
  - type: web
    name: collabiq-platform
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DB_HOST
        value: db.sbzecviaqezsbouymecf.supabase.co
